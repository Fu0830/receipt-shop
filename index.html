<!DOCTYPE html>
<html lang="zh-CN" data-night="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小票机 · 结单小票生成器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f7b8cd'/%3E%3Cpath d='M9 6h14v20l-2.4-1.8-2.4 1.8-2.4-1.8-2.4 1.8-2.4-1.8L9 26z' fill='%23fffdfb'/%3E%3Cpath d='M12 11h8M12 15h8M12 19h5' stroke='%23c98aa8' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="preconnect" href="https://sf3-scmcdn-cn.feishucdn.com" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Parisienne&amp;family=Noto+Serif+SC:wght@400;600&amp;display=swap">
<style>
/* ================= 主题变量 ================= */
:root{
  --hue: 212;
  --paper: #fffdfb;
  --paper-dot: hsl(var(--hue) 24% 91% / .45);
  --ink: hsl(var(--hue) 14% 25%);
  --ink-2: hsl(var(--hue) 11% 44%);
  --ink-3: hsl(var(--hue) 12% 60%);
  --rule: hsl(var(--hue) 14% 38% / .5);
  --accent: hsl(var(--hue) 64% 58%);
  --accent-2: hsl(calc(var(--hue) + 44) 72% 70%);
  --accent-3: hsl(calc(var(--hue) - 42) 76% 72%);
  --page: hsl(var(--hue) 42% 96%);
  --page-2: hsl(var(--hue) 46% 92%);
  --grid: hsl(var(--hue) 38% 84% / .55);
  --ui-ink: hsl(var(--hue) 16% 22%);
  --ui-ink-2: hsl(var(--hue) 10% 46%);
  --ui-line: hsl(var(--hue) 24% 84%);
  --ui-card: hsl(0 0% 100% / .82);
  --ui-field: #ffffff;
  --shadow: hsl(var(--hue) 40% 30% / .13);
  --radius: 14px;
  --font-ui: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-cn: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-script: "Parisienne", "Snell Roundhand", "Segoe Script", cursive;
}
[data-night="on"]{
  --page: hsl(var(--hue) 30% 13%);
  --page-2: hsl(var(--hue) 32% 9%);
  --grid: hsl(var(--hue) 40% 34% / .5);
  --ui-ink: hsl(var(--hue) 20% 94%);
  --ui-ink-2: hsl(var(--hue) 14% 70%);
  --ui-line: hsl(var(--hue) 20% 30%);
  --ui-card: hsl(var(--hue) 20% 20% / .72);
  --ui-field: hsl(var(--hue) 18% 24%);
  --shadow: hsl(0 0% 0% / .4);
}

/* ================= 基础 ================= */
*{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-ui);
  color: var(--ui-ink);
  background-color: var(--page);
  background-image:
    radial-gradient(120% 70% at 8% -10%, hsl(calc(var(--hue) + 30) 80% 90% / .75), transparent 60%),
    radial-gradient(90% 60% at 100% 0%, hsl(calc(var(--hue) - 30) 80% 91% / .7), transparent 55%),
    radial-gradient(100% 60% at 50% 110%, hsl(var(--hue) 70% 88% / .55), transparent 60%),
    repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 24px);
  transition: background-color .35s ease, color .35s ease;
}
[data-night="on"] body{ background-image:
    radial-gradient(120% 70% at 8% -10%, hsl(calc(var(--hue) + 30) 60% 30% / .55), transparent 60%),
    radial-gradient(90% 60% at 100% 0%, hsl(calc(var(--hue) - 30) 60% 28% / .5), transparent 55%),
    repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 24px);
}
button, input, select, textarea{ font: inherit; color: inherit; }
button{ cursor: pointer; }
h1,h2,h3,p{ margin: 0; }

/* ================= 顶栏 ================= */
.topbar{
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  background: linear-gradient(to bottom, hsl(0 0% 100% / .78), hsl(0 0% 100% / .5));
}
[data-night="on"] .topbar{ background: linear-gradient(to bottom, hsl(var(--hue) 24% 12% / .85), hsl(var(--hue) 24% 12% / .55)); }
.topbar-inner{
  max-width: 1180px; margin: 0 auto;
  padding: 10px 16px;
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
}
.brand{ display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-mark{
  width: 34px; height: 34px; flex: none; border-radius: 11px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, var(--accent-2), var(--accent));
  box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent);
  color: #fff;
}
.brand-name{ display: flex; flex-direction: column; line-height: 1.05; }
.brand-name b{ font-size: 16px; letter-spacing: .12em; font-weight: 600; }
.brand-name small{ font-size: 9px; letter-spacing: .26em; color: var(--ui-ink-2); margin-top: 3px; }
.toolbar{ margin-left: auto; display: flex; align-items: center; gap: 8px; }
.swatches{ display: flex; gap: 5px; }
.swatch{
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent;
  padding: 0; position: relative;
  box-shadow: 0 1px 4px hsl(0 0% 0% / .18);
  transition: transform .18s ease;
}
.swatch:hover{ transform: translateY(-2px); }
.swatch[aria-pressed="true"]{ border-color: var(--ui-ink); }
.swatch[aria-pressed="true"]::after{
  content:""; position: absolute; inset: 2px; border-radius: 50%;
  border: 2px solid hsl(0 0% 100% / .85);
}
.hue-wrap{
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--ui-line); border-radius: 999px;
  padding: 3px 9px 3px 7px; background: var(--ui-card);
  height: 30px;
}
.hue-wrap input[type=range]{
  -webkit-appearance: none; appearance: none;
  width: 76px; height: 12px; border-radius: 99px; background: linear-gradient(90deg,
    hsl(0 80% 62%), hsl(40 85% 62%), hsl(80 70% 58%), hsl(150 62% 52%),
    hsl(200 70% 58%), hsl(260 65% 62%), hsl(320 72% 65%), hsl(360 80% 62%));
  outline: none;
}
.hue-wrap input[type=range]::-webkit-slider-thumb{
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: #fff; border: 2px solid hsl(var(--hue) 60% 55%);
  box-shadow: 0 1px 3px hsl(0 0% 0% / .3);
}
.hue-wrap input[type=range]::-moz-range-thumb{
  width: 12px; height: 12px; border-radius: 50%; background: #fff;
  border: 2px solid hsl(var(--hue) 60% 55%);
}
.night-btn{
  height: 30px; padding: 0 11px; border-radius: 999px;
  border: 1px solid var(--ui-line); background: var(--ui-card);
  font-size: 12px; letter-spacing: .08em; color: var(--ui-ink-2);
  display: flex; align-items: center; gap: 5px;
}
.night-btn[aria-pressed="true"]{ background: var(--ui-ink); color: var(--page); border-color: var(--ui-ink); }
@media (max-width: 620px){
  .toolbar{ order: 3; flex: 1 0 100%; margin-left: 0; gap: 8px; }
  .swatches{ gap: 6px; flex: none; }
  .swatch{ width: 18px; height: 18px; }
  .hue-wrap{ flex: 1 1 auto; min-width: 0; padding: 3px 7px; gap: 0; }
  .hue-wrap svg{ display: none; }
  .hue-wrap input[type=range]{ width: 100%; min-width: 0; }
  .night-btn{ padding: 0 9px; font-size: 11px; letter-spacing: .04em; flex: none; }
  .brand-name small{ letter-spacing: .18em; }
  .topbar-inner{ padding: 9px 14px 10px; row-gap: 8px; }
}

/* ================= 布局 ================= */
.wrap{
  max-width: 1180px; margin: 0 auto;
  padding: 16px 14px calc(96px + env(safe-area-inset-bottom));
  display: grid; gap: 16px;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 1000px){
  .wrap{ grid-template-columns: 372px minmax(0, 1fr); gap: 26px; padding: 22px 22px 40px; align-items: start; }
  .editor-col{ position: sticky; top: 62px; }
}

/* ================= 表单 ================= */
.panel{
  background: var(--ui-card);
  border: 1px solid var(--ui-line);
  border-radius: var(--radius);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  overflow: hidden;
}
.panel-title{
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--ui-line);
  font-size: 12.5px; font-weight: 600; letter-spacing: .1em;
  color: var(--ui-ink);
}
.panel-title .dot{ width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.panel-title small{ margin-left: auto; font-weight: 400; letter-spacing: .16em; font-size: 9.5px; color: var(--ui-ink-2); }
.panel-body{ padding: 13px 14px 15px; display: grid; gap: 11px; }

.field{ display: grid; gap: 5px; }
.field > label{
  font-size: 11px; letter-spacing: .12em; color: var(--ui-ink-2);
  display: flex; align-items: center; gap: 6px;
}
.field > label .hint{ margin-left: auto; font-size: 10px; letter-spacing: .02em; color: var(--ui-ink-2); opacity: .8; }
.control{
  width: 100%; height: 38px; padding: 0 11px;
  border-radius: 10px; border: 1px solid var(--ui-line);
  background: var(--ui-field); color: var(--ui-ink);
  font-size: 15px; letter-spacing: .02em;
  transition: border-color .16s ease, box-shadow .16s ease;
}
.control::placeholder{ color: var(--ui-ink-2); opacity: .65; }
.control:focus{
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
select.control{ appearance: none; -webkit-appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ui-ink-2) 50%),
                    linear-gradient(135deg, var(--ui-ink-2) 50%, transparent 50%);
  background-position: calc(100% - 16px) 17px, calc(100% - 11px) 17px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.row2{ display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

/* 项目行 */
.items{ display: grid; gap: 10px; }
.item-card{
  border: 1px solid var(--ui-line); border-radius: 11px;
  background: color-mix(in srgb, var(--ui-field) 70%, transparent);
  padding: 10px 10px 11px;
  display: grid; gap: 9px;
  position: relative;
}
.item-head{ display: flex; align-items: center; gap: 8px; }
.item-index{
  font-family: var(--font-cn); font-size: 12px; color: #fff;
  background: var(--accent);
  padding: 2px 7px; border-radius: 6px; letter-spacing: .08em;
}
.item-label{ font-size: 10px; letter-spacing: .16em; color: var(--ui-ink-2); }
.item-del{
  margin-left: auto; width: 26px; height: 26px; border-radius: 8px;
  border: 1px solid var(--ui-line); background: transparent; color: var(--ui-ink-2);
  display: grid; place-items: center; font-size: 15px; line-height: 1;
}
.item-del:hover{ color: #fff; background: #d98aa0; border-color: #d98aa0; }
.grid3{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.add-item{
  width: 100%; height: 38px; border-radius: 10px;
  border: 1px dashed color-mix(in srgb, var(--accent) 55%, var(--ui-line));
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--accent); font-size: 12.5px; letter-spacing: .1em;
}
.add-item:hover{ background: color-mix(in srgb, var(--accent) 16%, transparent); }

/* 结算组 */
.money-row{ display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; }
.money-row > span{ font-size: 11px; letter-spacing: .1em; color: var(--ui-ink-2); }
.money-wrap{ position: relative; }
.money-wrap .cur{
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  font-size: 14px; color: var(--ui-ink-2); pointer-events: none;
}
.money-wrap .control{ padding-left: 26px; text-align: right; }
.auto-note{
  display: flex; align-items: center; gap: 6px; font-size: 10px;
  color: var(--ui-ink-2); letter-spacing: .04em;
}
.link-mini{
  border: 0; background: none; padding: 0; color: var(--accent);
  font-size: 10px; letter-spacing: .06em; text-decoration: underline;
  text-underline-offset: 2px;
}
.field-row-inline{ display: flex; align-items: center; gap: 10px; }
.switch{
  border: 1px solid var(--ui-line); background: var(--ui-field);
  border-radius: 999px; width: 44px; height: 26px; padding: 2px; position: relative;
  transition: background .18s ease;
}
.switch[aria-pressed="true"]{ background: var(--accent); border-color: var(--accent); }
.switch::after{
  content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; top: 2px; left: 2px; transition: transform .18s cubic-bezier(.34,1.4,.64,1);
  box-shadow: 0 1px 3px hsl(0 0% 0% / .25);
}
.switch[aria-pressed="true"]::after{ transform: translateX(18px); }

/* ================= 舞台 / 打印机 ================= */
.stage-col{ display: grid; gap: 12px; }
.stage-head{
  display: flex; align-items: baseline; gap: 10px; padding: 0 2px;
  width: 100%; max-width: 468px; margin: 0 auto;
}
.stage-head h2{
  font-family: var(--font-cn); font-size: 15px; letter-spacing: .22em; font-weight: 600;
}
.stage-head span{ font-size: 10px; letter-spacing: .24em; color: var(--ui-ink-2); }

/* ================= 小票纸 ================= */
.printer{
  position: relative;
  width: 100%; max-width: 468px; margin: 0 auto;
  border-radius: 26px;
  background: hsl(0 0% 100% / .55);
  border: 1px solid var(--ui-line);
  box-shadow: 0 26px 50px -34px var(--shadow);
  padding: 0 0 0;
  isolation: isolate;
}
[data-night="on"] .printer{ background: hsl(var(--hue) 22% 16% / .55); }
.machine{
  position: relative;
  border-radius: 25px 25px 12px 12px;
  padding: 15px 20px 16px;
  background:
    linear-gradient(180deg, hsl(0 0% 100%) 0%, hsl(var(--hue) 34% 97%) 52%, hsl(var(--hue) 28% 92%) 100%);
  box-shadow: 0 1px 0 hsl(0 0% 100% / .9) inset, 0 10px 18px -14px hsl(var(--hue) 30% 30% / .4);
  display: flex; align-items: center; gap: 9px;
}
.machine::after{
  content: ""; position: absolute; left: 24px; right: 24px; bottom: 5px; height: 4px;
  border-radius: 3px;
  background: linear-gradient(180deg, hsl(var(--hue) 20% 55% / .38), hsl(var(--hue) 22% 32% / .42));
  box-shadow: 0 1px 0 hsl(0 0% 100% / .9), inset 0 1px 3px hsl(var(--hue) 24% 18% / .35);
}
.led{
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: hsl(150 55% 60%);
  box-shadow: 0 0 0 2px hsl(150 55% 60% / .18);
}
[data-night="on"] .led{ box-shadow: 0 0 6px hsl(150 70% 60%); }
.machine-label{
  font-size: 10px; letter-spacing: .3em; color: hsl(var(--hue) 18% 34%);
}
.machine-sub{
  margin-left: auto; font-size: 10px; letter-spacing: .16em;
  color: hsl(var(--hue) 14% 46%);
}
.paper-mask{
  position: relative;
  overflow: hidden;
  padding: 0 14px;
  border-radius: 0 0 24px 24px;
  background: linear-gradient(180deg, hsl(var(--hue) 26% 88% / .55), transparent 42%);
}
.paper-mask::before{
  content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 14px; z-index: 2;
  background: linear-gradient(180deg, hsl(var(--hue) 24% 20% / .16), transparent);
  pointer-events: none;
}
.paper-track{
  transform: translateY(-101%);
  padding: 10px 0 22px;
}
.paper-mask.is-fed .paper-track{ transform: translateY(0); }
.paper-mask.is-printing .paper-track{
  animation: feed 1.6s cubic-bezier(.18,.86,.26,1) forwards;
}
@keyframes feed{
  0%{ transform: translateY(-101%); }
  58%{ transform: translateY(1.4%); }
  76%{ transform: translateY(-.7%); }
  88%{ transform: translateY(.4%); }
  100%{ transform: translateY(0); }
}
.printer.is-printing .machine{ animation: rumble .42s linear infinite; }
@keyframes rumble{
  0%,100%{ transform: translateY(0); }
  25%{ transform: translateY(-1px) translateX(.5px); }
  75%{ transform: translateY(1px) translateX(-.5px); }
}

/* ---------- 票据本体 ---------- */
.slip{
  position: relative;
  width: 100%; max-width: 396px; margin: 0 auto;
  color: var(--ink);
  font-family: var(--font-cn);
  background-color: var(--paper);
  background-image: radial-gradient(var(--paper-dot) 1px, transparent 1.2px);
  background-size: 9px 9px;
  box-shadow: 0 3px 0 -1px hsl(var(--hue) 20% 30% / .05), 0 16px 30px -22px hsl(var(--hue) 20% 20% / .55);
  overflow: hidden;
  /* 票面内部独立色板：纸永远是白纸，配色只跟色相走 */
  --tk-ink: hsl(var(--hue) 16% 22%);
  --tk-ink-2: hsl(var(--hue) 12% 42%);
  --tk-ink-3: hsl(var(--hue) 12% 57%);
  --tk-hair: hsl(var(--hue) 16% 30% / .42);
  --tk-soft: hsl(var(--hue) 16% 34% / .2);
  --tk-band: hsl(var(--hue) 48% 96.5%);
  --tk-soft-1: hsl(calc(var(--hue) + 44) 66% 95%);
  --tk-soft-2: hsl(calc(var(--hue) - 42) 66% 95%);
  --tk-deep: hsl(var(--hue) 60% 34%);
  --tk-deep-2: hsl(calc(var(--hue) + 44) 56% 40%);
  --tk-deep-3: hsl(calc(var(--hue) - 42) 50% 42%);
  --tk-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.tk-bar{ height: 5px; background: linear-gradient(90deg, hsl(calc(var(--hue) - 42) 74% 74%), var(--accent) 46%, hsl(calc(var(--hue) + 44) 72% 72%)); }
.tk-in{ padding: 11px 22px 0; }

/* 票头：SETTLEMENT + 单号 */
.tk-meta{
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  font-family: var(--tk-mono); font-size: 8.5px; letter-spacing: .2em;
  color: var(--tk-ink-3); text-transform: uppercase;
  padding-bottom: 7px; border-bottom: 1px solid var(--tk-hair);
}
.tk-meta span:last-child{ color: var(--tk-ink-2); letter-spacing: .14em; white-space: nowrap; }

/* 店名 */
.tk-brand{ display: flex; align-items: center; gap: 11px; padding: 11px 0 9px; }
.tk-logo{
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 9px;
  display: grid; place-content: center; text-align: center;
  background: var(--accent); color: #fff;
  font-family: var(--tk-mono); font-size: 12.5px; font-weight: 700; letter-spacing: .06em; line-height: 1.1;
  box-shadow: inset 0 0 0 1px hsl(0 0% 100% / .4);
}
.tk-name{ min-width: 0; flex: 1 1 auto; }
.tk-name h3{ font-size: 16px; font-weight: 600; letter-spacing: .07em; color: var(--tk-ink); line-height: 1.3; }
.tk-name p{
  margin-top: 2px; font-family: var(--tk-mono); font-size: 8px; letter-spacing: .24em;
  color: var(--tk-ink-3); text-transform: uppercase;
}
.tk-name em{ display: block; font-style: normal; font-size: 9.5px; letter-spacing: .1em; color: var(--tk-deep-2); margin-top: 4px; }

/* 插画 */
.tk-art{ margin: 2px -6px 0; }
.tk-art img{ display: block; width: 92%; height: auto; margin: 0 auto; }

/* 时间 */
.tk-time{
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px;
  font-family: var(--tk-mono); font-size: 9.5px; letter-spacing: .1em; color: var(--tk-ink-2);
  padding: 9px 0 3px;
}
.tk-time i{ width: 3px; height: 3px; background: var(--accent); border-radius: 50%; opacity: .8; }

/* 明细 */
.tk-cols{
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  padding: 9px 0 5px; border-bottom: 1px solid var(--tk-hair);
  font-size: 9px; letter-spacing: .24em; color: var(--tk-ink-3);
}
.tk-cols span:last-child{ text-align: right; white-space: nowrap; }
.tk-item{
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px;
  align-items: start; padding: 9px 0 8px;
  border-bottom: 1px dotted hsl(var(--hue) 16% 36% / .22);
}
.tk-item:last-child{ border-bottom: 0; }
.tk-no{
  width: 22px; height: 22px; border-radius: 6px;
  display: grid; place-content: center;
  background: var(--tk-soft-2); color: var(--tk-deep-3);
  font-family: var(--tk-mono); font-size: 9px; font-weight: 700; letter-spacing: .02em;
}
.tk-main{ min-width: 0; }
.tk-type{ font-size: 12.5px; font-weight: 600; letter-spacing: .03em; color: var(--tk-ink); line-height: 1.45; overflow-wrap: anywhere; }
.tk-type em{ font-family: var(--tk-mono); font-style: normal; font-size: 8px; font-weight: 400; letter-spacing: .16em; color: var(--tk-ink-3); margin-left: 6px; }
.tk-sub{ font-size: 10.5px; letter-spacing: .04em; color: var(--tk-deep-2); margin-top: 3px; overflow-wrap: anywhere; }
.tk-amt{ text-align: right; }
.tk-amt b{ display: block; font-size: 12.5px; font-weight: 600; letter-spacing: .02em; color: var(--tk-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tk-amt small{ display: block; margin-top: 3px; font-family: var(--tk-mono); font-size: 8.5px; letter-spacing: .1em; color: var(--tk-ink-3); }

/* 双线分隔：细线 + 彩色粗线 */
.tk-split{ position: relative; height: 8px; margin: 12px 0 2px; }
.tk-split::before{ content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--tk-hair); }
.tk-split::after{ content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--accent); opacity: .5; }

/* 合计 + 印章 */
.tk-sum{ display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding: 9px 0 10px; }
.tk-sum-l{ min-width: 0; flex: 1 1 auto; }
.tk-sum-l small{ display: block; font-family: var(--tk-mono); font-size: 8px; letter-spacing: .26em; color: var(--tk-ink-3); text-transform: uppercase; }
.tk-sum-l b{
  display: block; margin-top: 3px;
  font-size: 26px; line-height: 1.12; font-weight: 600; letter-spacing: -.01em;
  color: var(--tk-deep); font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.tk-stamp{
  position: relative; flex: 0 0 auto;
  border: 1.5px solid var(--tk-deep-2); border-radius: 6px;
  padding: 5px 9px 4px; text-align: center; line-height: 1.2;
  color: var(--tk-deep-2); transform: rotate(-4deg); opacity: .88;
  font-family: var(--font-cn);
}
.tk-stamp::before{ content: ""; position: absolute; inset: 3px; border: 1px solid currentColor; border-radius: 3px; opacity: .6; }
.tk-stamp b{ display: block; font-size: 11px; font-weight: 600; letter-spacing: .12em; }
.tk-stamp small{ display: block; margin-top: 2px; font-family: var(--tk-mono); font-size: 6.5px; letter-spacing: .2em; opacity: .85; }
.tk-stamp.is-hidden{ display: none; }

/* 实付 / 余额 双卡 */
.tk-two{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 0 12px; }
.tk-chip{ border-radius: 9px; padding: 7px 9px 8px; }
.tk-chip.a{ background: var(--tk-soft-1); }
.tk-chip.b{ background: var(--tk-soft-2); }
.tk-chip small{ display: block; font-size: 8.5px; letter-spacing: .12em; color: var(--tk-ink-2); }
.tk-chip small::before{
  content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 1px;
  background: currentColor; opacity: .55; margin-right: 5px; vertical-align: 1px;
}
.tk-chip b{ display: block; margin-top: 3px; font-size: 13px; font-weight: 600; color: var(--tk-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 寄语 */
.tk-quote{ text-align: center; padding: 1px 4px 12px; font-size: 10.5px; line-height: 1.85; letter-spacing: .04em; color: var(--tk-ink-2); }

/* 条码带 */
.tk-code{
  margin: 0 -22px; padding: 10px 22px 11px;
  background: var(--tk-band);
  border-top: 1px solid hsl(var(--hue) 16% 34% / .16);
  border-bottom: 1px solid hsl(var(--hue) 16% 34% / .16);
}
.tk-code svg{ width: 100%; height: 40px; display: block; color: var(--tk-ink); }
.tk-code p{ text-align: center; padding-top: 6px; font-family: var(--tk-mono); font-size: 8.5px; letter-spacing: .26em; color: var(--tk-ink-2); }

/* 票尾 */
.tk-end{ padding: 11px 0 12px; }
.tk-end p{ text-align: center; font-size: 10px; line-height: 1.75; letter-spacing: .04em; color: var(--tk-ink-3); }
.tk-tail{ height: 3px; background: linear-gradient(90deg, hsl(calc(var(--hue) - 42) 76% 74%), var(--accent) 50%, hsl(calc(var(--hue) + 44) 72% 72%)); }

/* ================= 按钮 ================= */
.actionbar{
  display: flex; gap: 9px; align-items: stretch;
  width: 100%; max-width: 468px; margin: 0 auto;
}
.btn{
  height: 46px; padding: 0 18px; border-radius: 999px;
  border: 1px solid transparent;
  font-size: 13.5px; letter-spacing: .12em;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: transform .14s ease, box-shadow .2s ease, background .2s ease;
  white-space: nowrap;
}
.btn:active{ transform: translateY(1px) scale(.995); }
.btn-primary{
  flex: 1 1 auto;
  color: #fff;
  background: linear-gradient(150deg, hsl(var(--hue) 68% 66%), hsl(calc(var(--hue) - 14) 60% 50%));
  box-shadow: 0 10px 22px -12px hsl(var(--hue) 60% 45% / .8), 0 2px 0 hsl(0 0% 100% / .32) inset;
}
.btn-primary[disabled]{ opacity: .55; box-shadow: none; cursor: progress; }
.btn-ghost{
  flex: 0 0 auto;
  color: var(--ui-ink);
  background: var(--ui-card);
  border-color: var(--ui-line);
}
.btn-ghost:hover{ background: color-mix(in srgb, var(--accent) 12%, var(--ui-field)); }
.hint-line{
  width: 100%; max-width: 468px; margin: 0 auto;
  text-align: center; font-size: 10.5px; letter-spacing: .1em; color: var(--ui-ink-2);
  padding: 8px 2px 0;
}
.toast{
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom));
  transform: translate(-50%, 12px);
  background: var(--ui-ink); color: var(--page);
  border-radius: 999px; padding: 9px 16px; font-size: 12px; letter-spacing: .08em;
  opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  z-index: 50;
}
.toast.show{ opacity: 1; transform: translate(-50%, 0); }

/* ================= 响应式 ================= */
@media (min-width: 1000px){
  .actionbar{ position: static; background: none; border: 0; padding: 0; backdrop-filter: none; }
  .btn{ height: 44px; }
  .stage-col{ position: sticky; top: 66px; }
}
@media (max-width: 460px){
  .quote{ font-size: 9.5px; letter-spacing: .01em; }
  .stamp{ width: 58px; height: 58px; }
  .stamp b{ font-size: 13px; }
}
@media (max-width: 999px){
  .actionbar{
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, hsl(0 0% 100% / .96) 30%, hsl(0 0% 100% / .72));
    border-top: 1px solid var(--ui-line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  [data-night="on"] .actionbar{
    background: linear-gradient(to top, hsl(var(--hue) 26% 12% / .96) 30%, hsl(var(--hue) 26% 12% / .7));
  }
  .btn-primary{ flex: 1 1 62%; }
  .btn-ghost{ flex: 1 1 34%; padding: 0 12px; font-size: 12.5px; }
}
@media (max-width: 420px){
  .slip{ padding: 17px 18px 18px; }
  .flourish .script{ font-size: 30px; }
  .stamp{ width: 56px; height: 56px; }
  .stamp b{ font-size: 12px; }
  .stamp small{ font-size: 6px; letter-spacing: .18em; }
  .welcome-en{ font-size: 9px; letter-spacing: .22em; }
  .cols{ font-size: 9.8px; letter-spacing: .1em; }
  .line-row{ font-size: 11.8px; }
  .t-row{ font-size: 11.8px; }
  .toolbar{ gap: 6px; }
  .hue-wrap input[type=range]{ width: 62px; }
}

@media (prefers-reduced-motion: reduce){
  .paper-mask.is-printing .paper-track{ animation-duration: .01ms !important; transform: translateY(0); }
  .printer.is-printing .machine{ animation: none; }
  .btn, .swatch{ transition: none; }
}

/* ================= 打印 ================= */
@media print{
  @page{ size: 80mm auto; margin: 4mm; }
  body{ background: #fff !important; }
  .topbar, .editor-col, .stage-head, .actionbar, .hint-line, .machine, .paper-mask::before, .toast{ display: none !important; }
  .wrap{ display: block; padding: 0; max-width: none; }
  .printer{ border: 0; box-shadow: none; background: none; }
  .paper-mask{ overflow: visible; padding: 0; background: none; }
  .paper-track{ transform: none !important; padding: 0; }
  .slip{ max-width: none; box-shadow: none; }
  .slip, .printer{ break-inside: avoid; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M5 3.5h14v17l-2.3-1.6-2.3 1.6-2.3-1.6-2.3 1.6-2.3-1.6L5 20.5z" />
          <path d="M8.6 8h6.8M8.6 11.5h6.8M8.6 15h4.2" />
        </svg>
      </span>
      <span class="brand-name"><b>小票机</b><small>RECEIPT PRINTER</small></span>
    </div>
    <div class="toolbar">
      <div class="swatches" id="swatches" role="group" aria-label="预设配色"></div>
      <label class="hue-wrap" title="拖动换配色">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" /><path d="M12 3v18M3 12h18" opacity=".45" />
        </svg>
        <input id="hue" type="range" min="0" max="360" step="1" value="212" aria-label="色相">
      </label>
      <button class="night-btn" id="nightBtn" aria-pressed="false" type="button">夜间</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="editor-col">

    <section class="panel">
      <div class="panel-title"><span class="dot"></span>票面信息<small>HEADER</small></div>
      <div class="panel-body">
        <div class="row2">
          <div class="field">
            <label for="clubEn">店名 · 英文</label>
            <input id="clubEn" class="control" autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label for="clubCn">店名 · 中文</label>
            <input id="clubCn" class="control" autocomplete="off">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="when">下单时间</label>
            <input id="when" type="datetime-local" class="control">
          </div>
          <div class="field">
            <label for="cur">币种</label>
            <select id="cur" class="control">
              <option value="£">£ 英镑</option>
              <option value="¥">¥ 人民币</option>
              <option value="$">$ 美元</option>
              <option value="€">€ 欧元</option>
              <option value="">不带符号</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="no">小票编号<span class="hint">印在条码下方</span></label>
          <input id="no" class="control" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title"><span class="dot"></span>点单项目<small>ORDER</small></div>
      <div class="panel-body">
        <div class="items" id="items"></div>
        <button class="add-item" id="addItem" type="button">+ 再加一项</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title"><span class="dot"></span>结算<small>TOTAL</small></div>
      <div class="panel-body">
        <div class="money-row">
          <span>合计</span>
          <div class="money-wrap"><span class="cur" data-cur>£</span>
            <input id="total" class="control" inputmode="decimal" autocomplete="off" placeholder="自动汇总">
          </div>
        </div>
        <div class="auto-note"><span id="totalNote">按明细自动汇总</span>
          <button class="link-mini" id="totalReset" type="button" hidden>恢复自动</button>
        </div>
        <div class="money-row">
          <span>实付金额</span>
          <div class="money-wrap"><span class="cur" data-cur>£</span>
            <input id="paid" class="control" inputmode="decimal" autocomplete="off" placeholder="留空＝合计">
          </div>
        </div>
        <div class="money-row">
          <span>卡内余额</span>
          <div class="money-wrap"><span class="cur" data-cur>£</span>
            <input id="balance" class="control" inputmode="decimal" autocomplete="off">
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title"><span class="dot"></span>祝福<small>BLESSING</small></div>
      <div class="panel-body">
        <div class="field">
          <label for="quote">票面寄语</label>
          <input id="quote" class="control" autocomplete="off">
        </div>
        <div class="field">
          <label for="name">祝福人名<span class="hint">写进页脚祝语</span></label>
          <input id="name" class="control" autocomplete="off" placeholder="小鱼饼饼公主">
        </div>
        <div class="field">
          <label for="tail">自定义页脚祝语<span class="hint">留空自动生成</span></label>
          <input id="tail" class="control" autocomplete="off" placeholder="祝{名字}在店里玩得愉快">
        </div>
        <div class="field">
          <label>盖章</label>
          <div class="field-row-inline">
            <button class="switch" id="stampOn" type="button" aria-pressed="true" aria-label="印章开关"></button>
            <input id="stampText" class="control" style="max-width:132px" autocomplete="off" aria-label="印章文字">
          </div>
        </div>
      </div>
    </section>

  </div>

  <div class="stage-col">
    <div class="stage-head"><h2>结账</h2><span>CHECKOUT</span></div>

    <div class="printer" id="printer">
      <div class="machine">
        <span class="led" aria-hidden="true"></span>
        <span class="machine-label">RECEIPT</span>
        <span class="machine-sub">80mm · 结单小票</span>
      </div>
      <div class="paper-mask is-fed" id="paperMask">
        <div class="paper-track">
          <div class="slip" id="slip"></div>
        </div>
      </div>
    </div>

    <div class="actionbar">
      <button class="btn btn-primary" id="printBtn" type="button">打印小票</button>
      <button class="btn btn-ghost" id="saveBtn" type="button">存下小票</button>
    </div>
    <p class="hint-line" id="hintLine">改一笔，小票会立刻跟着变</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  /* ---------- 小工具 ---------- */
  function toLocalInput(d) {
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function num(v) {
    var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''));
    return isFinite(n) ? n : 0;
  }
  function fmt(n) {
    if (!isFinite(n)) return '0';
    return Math.abs(n - Math.round(n)) < 0.005 ? String(Math.round(n)) : n.toFixed(2);
  }
  function money(n, spaced) {
    var cur = state.cur || '';
    return cur ? (spaced ? cur + ' ' : cur) + fmt(n) : fmt(n);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function monthName(d) {
    return ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()];
  }
  function formatTicket(v) {
    var d = v ? new Date(v) : new Date();
    if (isNaN(d.getTime())) d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return {
      day: d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()),
      min: p(d.getHours()) + ':' + p(d.getMinutes())
    };
  }

  function formatStamp(v) {
    var d = v ? new Date(v) : new Date();
    if (isNaN(d.getTime())) d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    var h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM', h12 = h % 12; if (!h12) h12 = 12;
    return monthName(d) + ' ' + p(d.getDate()) + '/' + d.getFullYear() + '  ' + p(h12) + ':' + p(d.getMinutes()) + ' ' + ap;
  }

  /* ---------- 金额 ---------- */
  function autoTotal() {

  function effTotal() {

  }
  function effPaid() {
    return state.paid.trim() === '' ? effTotal() : num(state.paid);
  }

    return state.slogan || '按单结清 · 谢绝挂账';

  function blessText() {
    if (state.tail.trim()) return state.tail.trim();
    var n = state.name.trim() || '你';
    var c = state.clubCn.trim() || '这里';
    return '祝' + n + '在' + c + '玩得开心玩得愉快';
  }

  /* ---------- 条码 ---------- */
  function barcodeSVG(seed) {
    var s = String(seed || '0'), h = 2166136261 >>> 0, i;
    for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    function rnd() { h = (Math.imul(h, 1664525) + 1013904223) >>> 0; return h / 4294967296; }
    var parts = '<rect x="0" y="0" width="4" height="46"/><rect x="7" y="0" width="4" height="46"/>';
    var x = 14;
    while (x < 284) {
      var w = 1 + Math.floor(rnd() * 3);
      if (x + w > 286) break;
      parts += '<rect x="' + x + '" y="0" width="' + w + '" height="46"/>';
      x += w + 1 + Math.floor(rnd() * 2);
    }
    parts += '<rect x="290" y="0" width="4" height="46"/><rect x="296" y="0" width="4" height="46"/>';
    return '<svg viewBox="0 0 300 46" preserveAspectRatio="none" fill="currentColor" aria-hidden="true">' + parts + '</svg>';
  }

            '<input class="control" data-k="sub" value="' + esc(it.sub) + '" autocomplete="off" aria-label="副标"></div>' +
        '</div>' +
        '<div class="field"><label>陪陪名称</label>' +
          '<input class="control" data-k="name" value="' + esc(it.name) + '" autocomplete="off" aria-label="陪陪名称"></div>' +
        '<div class="grid3">' +
          '<div class="field"><label>数量</label>' +
            '<input class="control" data-k="qty" inputmode="numeric" value="' + esc(it.qty) + '" autocomplete="off" aria-label="数量"></div>' +
          '<div class="field"><label>金额</label>' +
            '<input class="control" data-k="amt" inputmode="decimal" value="' + esc(it.amt) + '" autocomplete="off" aria-label="金额"></div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* ---------- 主题 ---------- */
  function applyTheme() {
    document.documentElement.style.setProperty('--hue', state.hue);
    document.documentElement.dataset.night = state.night ? 'on' : 'off';
    $('#hue').value = state.hue;
    $('#nightBtn').setAttribute('aria-pressed', state.night ? 'true' : 'false');
    $$('.swatch').forEach(function (b) {
      b.setAttribute('aria-pressed', String(Number(b.dataset.hue) === Number(state.hue)));
    });
  }
  function buildSwatches() {
    $('#swatches').innerHTML = PRESETS.map(function (p) {
      return '<button class="swatch" type="button" data-hue="' + p.h + '" title="' + p.name + ' 配色" aria-label="' + p.name + ' 配色" aria-pressed="false" ' +
        'style="background:linear-gradient(150deg, hsl(' + p.h + ' 70% 74%), hsl(' + p.h + ' 62% 54%))"></button>';
    }).join('');
  }

  /* ---------- 提示 ---------- */
  var toastTimer;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ---------- 状态存取 ---------- */
  var saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }, 220);
  }
  function load() {
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
    var m = {};
    Object.keys(DEFAULTS).forEach(function (k) { m[k] = saved[k] !== undefined ? saved[k] : DEFAULTS[k]; });
    if (!Array.isArray(m.items) || !m.items.length) {
      m.items = DEFAULTS.items.map(function (x) { return Object.assign({}, x); });
    }
    return m;
  }
  function syncForm() {
    $('#clubEn').value = state.clubEn;
    $('#clubCn').value = state.clubCn;
    $('#when').value = state.when || toLocalInput(new Date());
    $('#cur').value = state.cur;
    $('#no').value = state.no;
    $('#total').value = state.total;
    $('#paid').value = state.paid;
    $('#balance').value = state.balance;
    $('#quote').value = state.quote;
    $('#name').value = state.name;
    $('#tail').value = state.tail;
    $('#stampText').value = state.stampText;
    $('#stampOn').setAttribute('aria-pressed', state.stampOn ? 'true' : 'false');
    $$('[data-cur]').forEach(function (el) { el.textContent = state.cur; });
  }

  /* ---------- 打印 ---------- */
  var printing = false;
  function runPrint() {
    if (printing) return;
    printing = true;
    var mask = $('#paperMask'), printer = $('#printer'), btn = $('#printBtn');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    mask.classList.remove('is-fed', 'is-printing');
    $('#slip').getBoundingClientRect();
    /* 强制重排，让动画从头开始 */
    void mask.offsetWidth;
    mask.classList.add('is-printing');
    printer.classList.add('is-printing');
    btn.disabled = true;
    btn.textContent = '出票中…';
    var dur = reduce ? 60 : 1620;
    setTimeout(function () {
      mask.classList.remove('is-printing');
      mask.classList.add('is-fed');
      printer.classList.remove('is-printing');
      btn.disabled = false;
      btn.textContent = '再打一张';
      printing = false;
      $('#hintLine').textContent = '小票出来了，可以剪下来收着';
    }, dur);
  }
  function printWithPosition() {
    var printer = $('#printer');
    var r = printer.getBoundingClientRect();
    var needScroll = r.top < 0 || r.bottom > window.innerHeight + 40;
    if (needScroll) {
      printer.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(runPrint, 420);
    } else {
      runPrint();
    }
  }

  /* ---------- 存图 ---------- */
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  function savePng() {
    var mask = $('#paperMask');
    if (!mask.classList.contains('is-fed')) { mask.classList.add('is-fed'); }
    toast('正在生成图片…');
    var go = function () {
      return window.html2canvas($('#slip'), { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false })
        .then(function (canvas) {
          canvas.toBlob(function (blob) {
            if (!blob) { toast('生成失败，试试直接截图'); return; }
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '小票-' + (state.no || 'receipt') + '.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
            toast('已保存成 PNG');
          }, 'image/png');
        });
    };
    var run = function () {
      go().catch(function () { toast('生成失败，可长按小票保存'); });
    };
    if (window.html2canvas) { run(); return; }
    loadScript('https://fastly.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js')
      .then(run)
      .catch(function () { toast('生成失败，可长按小票保存'); });
  }

  /* ---------- 绑定 ---------- */
  function bind() {
    $('#items').addEventListener('input', function (e) {
      var card = e.target.closest('.item-card');
      var k = e.target.dataset.k;
      if (!card || !k) return;
      state.items[Number(card.dataset.idx)][k] = e.target.value;
      renderSlip(); save();
    });
    $('#items').addEventListener('click', function (e) {
      var del = e.target.closest('[data-del]');
      if (!del) return;
      if (state.items.length <= 1) return;
      state.items.splice(Number(del.dataset.del), 1);
      renderItems(); renderSlip(); save();
    });
    $('#addItem').addEventListener('click', function () {
      state.items.push({ type: '', sub: '', name: '', qty: '1', amt: '' });
      renderItems(); renderSlip(); save();
      var last = $('#items').lastElementChild;
      if (last) { $('[data-k=name]', last).focus(); }
    });

    ['clubEn', 'clubCn', 'when', 'no', 'quote', 'name', 'tail', 'stampText'].forEach(function (id) {
      $('#' + id).addEventListener('input', function (e) {
        state[id] = e.target.value;
        renderSlip(); save();
      });
    });
    $('#balance').addEventListener('input', function (e) {
      state.balance = e.target.value; renderSlip(); save();
    });
    $('#cur').addEventListener('change', function (e) {
      state.cur = e.target.value;
      $$('[data-cur]').forEach(function (el) { el.textContent = state.cur; });
      renderSlip(); save();
    });

    $('#total').addEventListener('input', function (e) {
      state.total = e.target.value; renderSlip(); save();
    });
    $('#totalReset').addEventListener('click', function () {
      state.total = ''; $('#total').value = ''; renderSlip(); save();
    });
    $('#paid').addEventListener('input', function (e) {
      state.paid = e.target.value; renderSlip(); save();
    });
    $('#stampOn').addEventListener('click', function () {
      state.stampOn = !state.stampOn;
      $('#stampOn').setAttribute('aria-pressed', state.stampOn ? 'true' : 'false');
      renderSlip(); save();
    });

    $('#swatches').addEventListener('click', function (e) {
      var b = e.target.closest('.swatch');
      if (!b) return;
      state.hue = Number(b.dataset.hue);
      applyTheme(); save();
    });
    $('#hue').addEventListener('input', function (e) {
      state.hue = Number(e.target.value);
      document.documentElement.style.setProperty('--hue', state.hue);
      $$('.swatch').forEach(function (b) {
        b.setAttribute('aria-pressed', String(Number(b.dataset.hue) === Number(state.hue)));
      });
      save();
    });
    $('#nightBtn').addEventListener('click', function () {
      state.night = !state.night;
      applyTheme(); save();
    });

    $('#printBtn').addEventListener('click', printWithPosition);
    $('#saveBtn').addEventListener('click', savePng);
    window.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'p') { /* 让浏览器原生打印 */ }
    });
  }

  /* ---------- 启动 ---------- */
  var state = load();
  buildSwatches();
  applyTheme();
  syncForm();
  renderItems();
  renderSlip();
  bind();
})();
</script>
</body>
</html>
